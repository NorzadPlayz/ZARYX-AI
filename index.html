<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    >

    <title>
        ZARYX AI — Enter the Future
    </title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <script
        type="module"
        src="script.js"
    ></script>

</head>


<body class="auth-page">


    <div class="auth-bg">

        <div class="grid"></div>

        <div class="glow glow-1"></div>

        <div class="glow glow-2"></div>

        <div class="particles"></div>

    </div>


    <main class="auth-container">


        <div class="auth-card">


            <div class="auth-logo">

                <div class="logo-core">
                    Z
                </div>

                <div class="logo-ring ring-a"></div>

                <div class="logo-ring ring-b"></div>

            </div>


            <h1>
                ZARYX
            </h1>


            <p class="auth-subtitle">
                ENTER THE NEXT GENERATION OF AI
            </p>


            <!-- MAIN LOGIN -->
            <section
                id="loginPanel"
                class="auth-panel"
            >


                <button
                    id="googleLoginButton"
                    class="auth-button google-button"
                >

                    <span class="google-icon">

                        <svg
                            viewBox="0 0 24 24"
                            aria-hidden="true"
                        >

                            <path
                                fill="#4285F4"
                                d="M21.35 12.27c0-.78-.07-1.53-.22-2.25H12v4.26h5.22a4.46 4.46 0 0 1-1.94 2.93v2.44h3.14c1.84-1.69 2.93-4.18 2.93-7.38z"
                            />

                            <path
                                fill="#34A853"
                                d="M12 21.99c2.63 0 4.84-.87 6.45-2.34l-3.14-2.44c-.87.58-1.98.92-3.31.92-2.54 0-4.69-1.72-5.46-4.03H3.3v2.52A9.74 9.74 0 0 0 12 21.99z"
                            />

                            <path
                                fill="#FBBC05"
                                d="M6.54 14.1a5.85 5.85 0 0 1 0-3.73V7.85H3.3a9.99 9.99 0 0 0 0 8.77l3.24-2.52z"
                            />

                            <path
                                fill="#EA4335"
                                d="M12 6.34c1.43 0 2.72.49 3.73 1.45l2.8-2.8C16.84 3.42 14.63 2.54 12 2.54a9.74 9.74 0 0 0-8.7 5.31l3.24 2.52C7.31 8.06 9.46 6.34 12 6.34z"
                            />

                        </svg>

                    </span>

                    Continue with Google

                </button>


                <div class="divider">

                    <span>
                        OR
                    </span>

                </div>


                <button
                    id="showEmailLoginButton"
                    class="auth-button neon-button"
                >

                    <span>
                        ✦
                    </span>

                    Continue with Email

                </button>


                <button
                    id="guestLoginButton"
                    class="guest-button"
                >
                    Continue as Guest
                </button>


                <p class="auth-footer-text">
                    By entering ZARYX, you agree to use it responsibly.
                </p>

            </section>


            <!-- EMAIL LOGIN -->
            <section
                id="emailLoginPanel"
                class="auth-panel hidden"
            >

                <h2>
                    WELCOME BACK
                </h2>


                <input
                    id="loginEmail"
                    type="email"
                    placeholder="Email address"
                    autocomplete="email"
                >


                <input
                    id="loginPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="current-password"
                >


                <button
                    id="emailLoginButton"
                    class="auth-button neon-button"
                >
                    LOGIN
                </button>


                <button
                    id="showSignupButton"
                    class="text-button"
                >
                    Create an account
                </button>


                <button
                    id="backToLoginButton"
                    class="back-button"
                >
                    ← Back
                </button>

            </section>


            <!-- SIGN UP -->
            <section
                id="signupPanel"
                class="auth-panel hidden"
            >

                <h2>
                    CREATE ZARYX ID
                </h2>


                <input
                    id="signupName"
                    type="text"
                    placeholder="Your name"
                    autocomplete="name"
                >


                <input
                    id="signupEmail"
                    type="email"
                    placeholder="Email address"
                    autocomplete="email"
                >


                <input
                    id="signupPassword"
                    type="password"
                    placeholder="Password"
                    autocomplete="new-password"
                >


                <button
                    id="emailSignupButton"
                    class="auth-button neon-button"
                >
                    CREATE ACCOUNT
                </button>


                <button
                    id="backToLoginFromSignupButton"
                    class="back-button"
                >
                    ← Back
                </button>

            </section>


            <div
                id="authStatus"
                class="auth-status"
            ></div>


        </div>


        <div class="auth-bottom">

            <span>
                ⚡ ZARYX AI
            </span>

            <span>
                •
            </span>

            <span>
                ONLINE
            </span>

        </div>


    </main>


</body>

</html>
